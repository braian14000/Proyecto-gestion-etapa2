{% extends 'base.html' %}

{% block title %}Mi QR{% endblock %}

{% block body %}
  <div class="container mt-5 text-center">
    <div class="card d-inline-block p-4 mt-3">
      <img src="{{ qr_path }}" alt="QR" style="max-width:300px;">
    </div>
    <div class="mt-3">
      <a class="btn" href="{{ qr_path }}" download style="background-color:#1f5a3d; border-color:#1f5a3d; color:#fff;">Descargar QR</a>
    </div>
    <div class="mt-3">
      <a class="btn" href="{{ back_url }}" style="background-color:#4a5568; border-color:#4a5568; color:#fff;">Volver atrás</a>
    </div>
  </div>
{% endblock %}
