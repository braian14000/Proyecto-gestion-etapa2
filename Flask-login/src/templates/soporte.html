{% extends 'base.html' %}

{% block title %}Soporte{% endblock %}

{% block customCSS %}
<style>
        .soporte-page { min-height: calc(100vh - 40px); padding: 20px 16px 70px; color: #19335f; }
        .contenedor-formulario { width: 100%; max-width: 620px; margin: 0 auto; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 28px rgba(24, 54, 98, .13); }
        .soporte-header { display: flex; align-items: center; gap: 24px; min-height: 105px; padding: 17px 30px; background: linear-gradient(135deg, #0b4f9e, #1162c5); }
        .soporte-logo { width: 210px; max-width: 46%; filter: brightness(0) invert(1); }
        .soporte-header h2 { margin: 0; padding-left: 24px; border-left: 1px solid rgba(255,255,255,.8); color: #fff; font-size: 24px; white-space: nowrap; }
        .soporte-content { padding: 18px 36px 24px; }
        .btn-volver { display: block; width: 135px; margin: 0 auto 14px; padding: 8px 14px; border: 1px solid #9ab6df; border-radius: 7px; color: #1760bd; background: #fff; text-align: center; text-decoration: none; font-weight: 700; }
        .subtitulo { margin: 0 0 22px; color: #284979; text-align: center; font-size: 15px; }
        .grupo-input { display: flex; flex-direction: column; margin-bottom: 16px; }
        .grupo-input label { margin-bottom: 7px; color: #173765; font-size: 14px; font-weight: 700; }
        .grupo-input input[type="text"], .grupo-input input[type="email"], .grupo-input select, .grupo-input textarea { width: 100%; box-sizing: border-box; padding: 10px 13px; border: 1px solid #c6d4e8; border-radius: 7px; outline: none; color: #294b7e; background: #fff; font-size: 15px; }
        .grupo-input input::placeholder, .grupo-input textarea::placeholder { color: #7185a5; }
        .grupo-input input:focus, .grupo-input select:focus, .grupo-input textarea:focus { border-color: #2872d5; box-shadow: 0 0 0 3px rgba(40,114,213,.12); }
        .grupo-input textarea { min-height: 78px; resize: vertical; }
        .adjunto-label { margin-bottom: 7px; color: #173765; font-size: 14px; font-weight: 700; }
        .archivo-area { display: block; padding: 18px 15px; border: 1px dashed #a9bfdc; border-radius: 7px; color: #315887; text-align: center; cursor: pointer; }
        .archivo-area strong { display: block; margin-bottom: 6px; font-size: 14px; }
        .archivo-area small { color: #7185a5; }
        .archivo-input { display: none; }
        .btn-enviar { width: 100%; margin-top: 2px; padding: 13px; border: 0; border-radius: 7px; background: #1161be; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-enviar:hover { background: #0b4f9e; }
        @media (max-width: 600px) { .soporte-header { gap: 16px; padding: 20px; } .soporte-logo { width: 170px; } .soporte-header h2 { padding-left: 16px; font-size: 21px; } .soporte-content { padding: 22px 20px 28px; } }
    </style>
{% endblock %}

{% block body %}
<div class="soporte-page">
    <div class="contenedor-formulario">
                <div class="soporte-header">
                        <img class="soporte-logo" src="{{ url_for('static', filename='img/LogoUTN_Gestion_De_Eventos.png') }}" alt="UTN Gestión de eventos">
                </div>
                <div class="soporte-content">
        <a href="{{ url_for('home') }}" class="btn-volver">Volver</a>
        <p class="subtitulo">Reportá un problema en la plataforma de Eventos de la UTN.</p>

        <form action="{{ url_for('enviar_ticket') }}" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grupo-input">
                <label for="nombre">Nombre Completo *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre y Apellido" required maxlength="100" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü' -]+" title="Solo se permiten letras, espacios, apóstrofes y guiones" oninput="this.value=this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü' -]/g,'')">
            </div>

            <div class="grupo-input">
                <label for="legajo">Legajo o DNI *</label>
                <input type="text" id="legajo" name="legajo" placeholder="Ej: 49500 o DNI" required inputmode="numeric" maxlength="8" pattern="[0-9]{1,8}" title="Ingresá solo números, hasta 8 dígitos" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="grupo-input">
                <label for="email">Tu Correo Electrónico *</label>
                <input type="email" id="email" name="email" placeholder="Ej: tu_correo@gmail.com" required>
            </div>
            

            <div class="grupo-input">
                <label for="prioridad">Gravedad del problema *</label>
                <select id="prioridad" name="prioridad" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="baja"> Baja </option>
                    <option value="media"> Media </option>
                    <option value="alta"> Alta </option>
                </select>
            </div>
            
            <div class="grupo-input">
                <label for="categoria">Seleccioná el problema *</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Seleccioná una opción</option>
                    <option value="No puedo iniciar sesión">No puedo iniciar sesión</option>
                    <option value="No puedo inscribirme a un evento">No puedo inscribirme a un evento</option>
                    <option value="No puedo ver mi código QR">No puedo ver mi código QR</option>
                    <option value="No recibí el correo con el QR">No recibí el correo con el QR</option>
                    <option value="Problema con mis datos personales">Problema con mis datos personales</option>
                    <option value="Otro">Otro problema</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="descripcion">Descripción problema *</label>
                <textarea id="descripcion" name="descripcion" rows="5" placeholder="Describir tu Problema" required></textarea>
            </div>

            <div class="grupo-input">
                <label for="adjunto" class="adjunto-label">Adjuntar captura o imagen (Opcional):</label>
                <label for="adjunto" class="archivo-area">
                    <strong>Arrastrá y soltá tu archivo aquí<br>o hacé clic para seleccionar</strong>
                    <small>Formatos permitidos: JPG, PNG, GIF. Tamaño máximo: 5MB</small>
                    <input type="file" id="adjunto" name="adjunto" class="archivo-input" accept="image/jpeg,image/png,image/gif">
                </label>
            </div>

            <button type="submit" class="btn-enviar">Enviar Ticket</button>
        </form>
        </div>
    </div>
  </div>

{% endblock %}
