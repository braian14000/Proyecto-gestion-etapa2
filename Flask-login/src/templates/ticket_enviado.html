<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket enviado</title>
    <style>
        :root { color: #19335f; font-family: Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef6ff; }
        .confirmacion { width: min(100%, 808px); padding: 26px 38px 24px; border-radius: 14px; background: #fff; text-align: center; box-shadow: 0 18px 40px rgba(8, 45, 105, .28); }
        .logo { width: 150px; max-width: 60%; }
        .check { width: 108px; height: 108px; margin: 22px auto 14px; border: 6px solid #1762c5; border-radius: 50%; display: grid; place-items: center; color: #1762c5; font-size: 68px; line-height: 1; }
        h1 { margin: 0 0 10px; color: #1762c5; font-size: clamp(34px, 6vw, 48px); }
        .mensaje { margin: 0; font-size: clamp(20px, 3vw, 28px); }
        .mensaje strong { color: #1762c5; }
        .detalle { margin: 12px 0 26px; font-size: 20px; }
        .separador { display: flex; align-items: center; gap: 14px; justify-content: center; margin-bottom: 22px; color: #1762c5; }
        .separador::before, .separador::after { content: ''; height: 1px; flex: 1; background: #9fc4f5; }
        .separador span { width: 12px; height: 12px; border-radius: 50%; background: #1762c5; }
        .recordatorio { display: flex; align-items: center; gap: 18px; margin: 0 auto 24px; padding: 14px 22px; border-radius: 10px; background: #e7f0ff; text-align: left; font-size: 20px; }
        .marcador { width: 58px; height: 58px; flex: 0 0 58px; display: grid; place-items: center; border: 3px solid #1762c5; border-radius: 50%; color: #1762c5; font-size: 32px; }
        .volver { display: inline-flex; align-items: center; justify-content: center; gap: 24px; width: min(100%, 412px); padding: 16px; border-radius: 7px; background: #1762c5; color: white; font-size: 23px; text-decoration: none; }
        @media (max-width: 560px) { .confirmacion { padding: 24px 18px; } .recordatorio { font-size: 16px; } .volver { font-size: 19px; } }
    </style>
</head>
<body>
    <main class="confirmacion">
        <img class="logo" src="{{ url_for('static', filename='img/LogoUTN_Gestion_De_Eventos.png') }}" alt="UTN Gestión de eventos">
        <div class="check" aria-hidden="true">✓</div>
        <h1>¡Gracias!</h1>
        <p class="mensaje">Hola, recibimos tu ticket <strong>#{{ ticket_id }}</strong>.</p>
        <p class="detalle">Nuestro equipo lo revisará a la brevedad.</p>
        <div class="separador"><span></span></div>
        <div class="recordatorio"><div class="marcador" aria-hidden="true">♡</div><span>Guardar el número de ticket por favor.</span></div>
        <a class="volver" href="{{ url_for('soporte') }}"><span aria-hidden="true">←</span> Volver al formulario</a>
    </main>
</body>
</html>
