<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .btn-soporte {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            z-index: 2000 !important;
            background-color: #04047f !important;
            color: #ffffff !important;
            border: none !important;
            padding: 10px 16px !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            transition: background-color 0.3s ease !important;
            display: inline-block !important;
            text-decoration: none !important;
        }
        .btn-soporte:hover {
            background-color: #03035f !important;
            color: #ffffff !important;
            text-decoration: none !important;
        }
        .acciones-flotantes {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
    </style>
</head>
<body style="background-color: #eef6ff;">
    <div class="acciones-flotantes">
        <a href="{{ url_for('soporte') }}" class="btn-soporte" target="_blank" rel="noopener noreferrer">Soporte</a>
    </div>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form action="/login" method="post">
            <input type="text" name="usuario" placeholder="Usuario o correo" required>
            <input type="password" name="contrasena" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
